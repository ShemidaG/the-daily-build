<script>
(function () {
  "use strict";
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const PROJ_COLORS = ["#6c7dff","#46e0c8","#ff5f6d","#ffab3d","#b06bff","#4db2ff","#ff8fce","#7ee08f"];
  const P_COLORS = { 1: "var(--p1)", 2: "var(--p2)", 3: "var(--p3)", 4: "var(--p4)" };

  // ---------- state ----------
  const DEFAULT = { version: 1, projects: [], tasks: [], focusLog: [], templates: [], savedViews: [], activeTaskId: null,
                    settings: { theme: "dark", view: "today", project: null } };
  let state = load();
  function load() {
    try { const s = JSON.parse(localStorage.getItem("momentum")); if (s && s.tasks) return Object.assign({}, DEFAULT, s); }
    catch (e) {}
    // seed a friendly first-run example
    const pid = uid();
    return { version: 1, activeTaskId: null, focusLog: [], templates: [], savedViews: [],
      projects: [{ id: pid, name: "Getting Started", color: PROJ_COLORS[0] }],
      settings: { theme: "dark", view: "today", project: null },
      tasks: [
        mkTask("Welcome to Momentum — click me to open details", { priority: 2, projectId: pid, due: todayKey(),
          notes: "Momentum is your command center: projects, priorities, due dates, subtasks, a focus timer, and analytics.\n\nTry the quick-add above with !p1, #Project, @tag and a due date like 'tomorrow'.",
          subtasks: [ sub("Add your first real task", true), sub("Press ▶ Start on the focus timer", false), sub("Check the Analytics tab", false) ] }),
        mkTask("Plan the week's top 3 priorities", { priority: 1, projectId: pid, due: todayKey() }),
        mkTask("Review inbox and clear to zero", { priority: 3, projectId: pid, due: tomorrowKey() }),
      ] };
  }
  function save() { localStorage.setItem("momentum", JSON.stringify(state)); }
  function sub(title, done) { return { id: uid(), title, done: !!done }; }
  function mkTask(title, o) {
    o = o || {};
    return { id: uid(), title, notes: o.notes || "", priority: o.priority || 4, due: o.due || null,
      projectId: o.projectId || null, tags: o.tags || [], subtasks: o.subtasks || [], repeat: o.repeat || "none",
      status: o.status || "todo", done: false, createdAt: Date.now(), completedAt: null, focusSeconds: 0,
      order: o.order != null ? o.order : -Date.now() };
  }

  // ---------- dates ----------
  function key(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function todayKey() { return key(new Date()); }
  function tomorrowKey() { const d = new Date(); d.setDate(d.getDate() + 1); return key(d); }
  function addDays(base, n) { const d = new Date(base); d.setDate(d.getDate() + n); return d; }
  function parseKey(k) { const [y, m, dd] = k.split("-").map(Number); return new Date(y, m - 1, dd); }
  function fmtDue(k) {
    if (!k) return "";
    const t = todayKey(), tm = tomorrowKey();
    if (k === t) return "Today";
    if (k === tm) return "Tomorrow";
    const d = parseKey(k), now = new Date(); now.setHours(0,0,0,0);
    const diff = Math.round((d - now) / 86400000);
    if (diff < 0) return Math.abs(diff) + "d overdue";
    const opts = { month: "short", day: "numeric" };
    return d.toLocaleDateString(undefined, opts);
  }
  const WEEKDAYS = ["sun","mon","tue","wed","thu","fri","sat"];

  // ---------- quick-add parser ----------
  function parseQuick(raw) {
    let text = raw.trim(); const out = { priority: 4, projectId: null, tags: [], due: null, repeat: "none" };
    // recurrence: "every day/week/month/weekday" or daily/weekly/monthly
    const REPEAT_MAP = { day: "daily", week: "weekly", month: "monthly", weekday: "weekday",
      daily: "daily", weekly: "weekly", monthly: "monthly" };
    text = text.replace(/\bevery\s+(day|week|month|weekday)\b/i, (m, u) => { out.repeat = REPEAT_MAP[u.toLowerCase()]; return " "; });
    text = text.replace(/\b(daily|weekly|monthly)\b/i, (m, u) => { out.repeat = REPEAT_MAP[u.toLowerCase()]; return " "; });
    if (out.repeat !== "none" && !out.due) out.due = todayKey();
    text = text.replace(/(?:^|\s)!?p([1-4])\b/gi, (m, p) => { out.priority = +p; return " "; });
    text = text.replace(/(?:^|\s)#([\w-]+)/g, (m, name) => {
      let pj = state.projects.find((p) => p.name.toLowerCase() === name.toLowerCase());
      if (!pj) { pj = { id: uid(), name: name, color: PROJ_COLORS[state.projects.length % PROJ_COLORS.length] }; state.projects.push(pj); }
      out.projectId = pj.id; return " ";
    });
    text = text.replace(/(?:^|\s)@([\w-]+)/g, (m, t) => { out.tags.push(t); return " "; });
    // explicit date YYYY-MM-DD
    text = text.replace(/\b(\d{4}-\d{2}-\d{2})\b/, (m, d) => { out.due = d; return " "; });
    // keywords
    if (!out.due) {
      const lower = text.toLowerCase();
      if (/\btoday\b/.test(lower)) { out.due = todayKey(); text = text.replace(/\btoday\b/i, " "); }
      else if (/\btomorrow\b/.test(lower)) { out.due = tomorrowKey(); text = text.replace(/\btomorrow\b/i, " "); }
      else {
        for (let i = 0; i < 7; i++) {
          const re = new RegExp("\\b" + WEEKDAYS[i] + "(?:day)?\\b", "i");
          if (re.test(lower)) {
            const now = new Date(); let delta = (i - now.getDay() + 7) % 7; if (delta === 0) delta = 7;
            out.due = key(addDays(now, delta)); text = text.replace(re, " "); break;
          }
        }
      }
    }
    out.title = text.replace(/\s+/g, " ").trim();
    return out;
  }

  // ---------- mutations ----------
  function addTask(raw) {
    const p = parseQuick(raw); if (!p.title) return;
    state.tasks.unshift(mkTask(p.title, p));
    save(); render();
  }
  function nextDue(dueKey, repeat) {
    const base = dueKey ? parseKey(dueKey) : new Date();
    if (repeat === "daily") return key(addDays(base, 1));
    if (repeat === "weekly") return key(addDays(base, 7));
    if (repeat === "weekday") { let d = addDays(base, 1); while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1); return key(d); }
    if (repeat === "monthly") { const d = new Date(base); d.setMonth(d.getMonth() + 1); return key(d); }
    return dueKey;
  }
  function toggleDone(id) {
    const t = state.tasks.find((x) => x.id === id); if (!t) return;
    t.done = !t.done; t.status = t.done ? "done" : "todo"; t.completedAt = t.done ? Date.now() : null;
    if (t.done) {
      if (t.repeat && t.repeat !== "none") {
        const nt = mkTask(t.title, { priority: t.priority, projectId: t.projectId, tags: t.tags.slice(),
          notes: t.notes, repeat: t.repeat, due: nextDue(t.due, t.repeat),
          subtasks: t.subtasks.map((s) => sub(s.title, false)) });
        state.tasks.unshift(nt);
        toast("Completed · next one scheduled for " + fmtDue(nt.due) + " 🔁");
      } else toast("Task completed 🎉");
    }
    save(); render();
  }
  function delTask(id) {
    const idx = state.tasks.findIndex((x) => x.id === id); if (idx < 0) return;
    const removed = state.tasks[idx];
    state.tasks.splice(idx, 1); if (state.activeTaskId === id) state.activeTaskId = null; save(); render();
    toast("Task deleted", "Undo", () => { state.tasks.splice(Math.min(idx, state.tasks.length), 0, removed); save(); render(); toast("Restored"); });
  }
  function updTask(id, patch) { const t = state.tasks.find((x) => x.id === id); if (t) Object.assign(t, patch); save(); }
  function duplicateTask(id) {
    const t = state.tasks.find((x) => x.id === id); if (!t) return;
    const c = mkTask(t.title + " (copy)", { priority: t.priority, projectId: t.projectId, tags: t.tags.slice(),
      notes: t.notes, repeat: t.repeat, due: t.due, subtasks: t.subtasks.map((s) => sub(s.title, s.done)) });
    const idx = state.tasks.findIndex((x) => x.id === id); state.tasks.splice(idx, 0, c); save(); render(); toast("Task duplicated");
  }
  function reorderManual(dragId, targetId, before) {
    if (dragId === targetId) return;
    const from = state.tasks.findIndex((x) => x.id === dragId); if (from < 0) return;
    const moved = state.tasks.splice(from, 1)[0];
    let ti = state.tasks.findIndex((x) => x.id === targetId); if (ti < 0) { state.tasks.splice(from, 0, moved); return; }
    if (!before) ti++;
    state.tasks.splice(ti, 0, moved);
    state.tasks.forEach((t, i) => { t.order = i; });
    save(); render();
  }
  // templates
  function saveTemplate(id) {
    const t = state.tasks.find((x) => x.id === id); if (!t) return;
    state.templates.unshift({ id: uid(), name: t.title, priority: t.priority, projectId: t.projectId,
      tags: t.tags.slice(), repeat: t.repeat, notes: t.notes, subtasks: t.subtasks.map((s) => s.title) });
    if (state.templates.length > 20) state.templates.pop();
    save(); render(); toast("Saved as template ⭐");
  }
  function createFromTemplate(tid) {
    const tp = state.templates.find((x) => x.id === tid); if (!tp) return;
    state.tasks.unshift(mkTask(tp.name, { priority: tp.priority, projectId: tp.projectId, tags: (tp.tags || []).slice(),
      repeat: tp.repeat, notes: tp.notes, due: (tp.repeat && tp.repeat !== "none") ? todayKey() : null,
      subtasks: (tp.subtasks || []).map((s) => sub(s, false)) }));
    save(); render(); toast("Task added from template");
  }
  function delTemplate(tid) { state.templates = state.templates.filter((x) => x.id !== tid); save(); render(); }
  // bulk
  function bulkApply(fn, msg) { state.tasks.forEach((t) => { if (selected.has(t.id)) fn(t); }); selected.clear(); selectMode = false; save(); render(); if (msg) toast(msg); }
  function bulkDelete() { const n = selected.size; state.tasks = state.tasks.filter((t) => !selected.has(t.id)); selected.clear(); selectMode = false; save(); render(); toast(n + " task" + (n === 1 ? "" : "s") + " deleted"); }

  // ---------- rendering ----------
  let currentView = state.settings.view || "today";
  let openTaskId = null;
  let searchQ = "";
  let listOpts = { sort: "smart", priority: "all", tag: "all" };
  let weekAnchor = new Date();
  let weekAddDay = null; // day key currently showing an inline add input
  let selectMode = false; // multi-select for bulk actions
  const selected = new Set();
  let dragReorderId = null; // task id being reordered
  let savingView = false; // inline "name this saved view" input is open
  let activeViewId = null; // currently applied saved view

  function applyListOpts(list) {
    let out = list;
    if (listOpts.priority !== "all") out = out.filter((t) => t.priority === +listOpts.priority);
    if (listOpts.tag !== "all") out = out.filter((t) => t.tags.includes(listOpts.tag));
    return out;
  }
  function sortFlat(list) {
    const s = listOpts.sort, c = list.slice();
    if (s === "priority") return c.sort((a, b) => a.priority - b.priority);
    if (s === "due") return c.sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
    if (s === "created") return c.sort((a, b) => b.createdAt - a.createdAt);
    if (s === "az") return c.sort((a, b) => a.title.localeCompare(b.title));
    if (s === "manual") return c.sort((a, b) => (a.order || 0) - (b.order || 0));
    return c.sort((a, b) => a.priority - b.priority || (a.due || "9").localeCompare(b.due || "9")); // smart
  }
  function allTags() { const s = new Set(); state.tasks.forEach((t) => t.tags.forEach((x) => s.add(x))); return Array.from(s).sort(); }
  function renderListControls(root) {
    const bar = document.createElement("div"); bar.className = "list-ctrls";
    const sortOpts = [["smart","Smart"],["priority","Priority"],["due","Due date"],["created","Newest"],["az","A–Z"],["manual","Custom (drag)"]]
      .map(([v, l]) => '<option value="' + v + '"' + (listOpts.sort === v ? " selected" : "") + ">" + l + "</option>").join("");
    const prioOpts = ['<option value="all"' + (listOpts.priority === "all" ? " selected" : "") + '>All</option>']
      .concat([1,2,3,4].map((p) => '<option value="' + p + '"' + (listOpts.priority == p ? " selected" : "") + ">P" + p + "</option>")).join("");
    const tags = allTags();
    const tagOpts = ['<option value="all"' + (listOpts.tag === "all" ? " selected" : "") + '>All tags</option>']
      .concat(tags.map((t) => '<option value="' + esc(t) + '"' + (listOpts.tag === t ? " selected" : "") + ">#" + esc(t) + "</option>")).join("");
    const filtered = listOpts.priority !== "all" || listOpts.tag !== "all" || listOpts.sort !== "smart";
    bar.innerHTML =
      '<div class="lc"><label>Sort</label><select id="lc-sort">' + sortOpts + "</select></div>" +
      '<div class="lc"><label>Priority</label><select id="lc-prio">' + prioOpts + "</select></div>" +
      (tags.length ? '<div class="lc"><label>Tag</label><select id="lc-tag">' + tagOpts + "</select></div>" : "") +
      '<button class="clearf lc-select' + (selectMode ? " on" : "") + '" id="lc-select">' + (selectMode ? "✓ Selecting" : "☑ Select") + "</button>" +
      (filtered ? '<button class="clearf" id="lc-clear">✕ Reset</button>' : "");
    root.appendChild(bar);
    $("#lc-sort", bar).onchange = (e) => { listOpts.sort = e.target.value; render(); };
    $("#lc-prio", bar).onchange = (e) => { listOpts.priority = e.target.value; render(); };
    if ($("#lc-tag", bar)) $("#lc-tag", bar).onchange = (e) => { listOpts.tag = e.target.value; render(); };
    if ($("#lc-clear", bar)) $("#lc-clear", bar).onclick = () => { listOpts = { sort: "smart", priority: "all", tag: "all" }; render(); };
    $("#lc-select", bar).onclick = () => { selectMode = !selectMode; selected.clear(); render(); };
    if (listOpts.sort === "manual") { const h = document.createElement("span"); h.style.cssText = "font-size:11px;color:var(--faint);width:100%;margin-top:2px"; h.textContent = "Drag the ⠿ handle to reorder tasks."; bar.appendChild(h); }
  }

  function activeTasks() { return state.tasks.filter((t) => !t.done); }
  function projById(id) { return state.projects.find((p) => p.id === id); }

  let searchPreds = [];
  function buildSearch(raw) {
    const toks = (raw || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
    const preds = [], free = [];
    const tKey = todayKey(), tmKey = tomorrowKey(), wkMax = key(addDays(new Date(), 7));
    toks.forEach((tok) => {
      let m;
      if (/^!?p[1-4]$/.test(tok)) { const p = +tok.slice(-1); preds.push((t) => t.priority === p); }
      else if ((m = tok.match(/^due:(.+)$/))) { const v = m[1];
        if (v === "today") preds.push((t) => t.due === tKey);
        else if (v === "tomorrow") preds.push((t) => t.due === tmKey);
        else if (v === "overdue") preds.push((t) => t.due && t.due < tKey && !t.done);
        else if (v === "week") preds.push((t) => t.due && t.due <= wkMax);
        else if (v === "none") preds.push((t) => !t.due);
      }
      else if (tok === "overdue") preds.push((t) => t.due && t.due < tKey && !t.done);
      else if ((m = tok.match(/^is:(done|open)$/))) preds.push((t) => (m[1] === "done" ? t.done : !t.done));
      else if ((m = tok.match(/^has:(sub|subtasks|notes)$/))) preds.push((t) => (m[1] === "notes" ? !!(t.notes && t.notes.trim()) : t.subtasks.length > 0));
      else if ((m = tok.match(/^#(.+)$/))) { const n = m[1]; preds.push((t) => { const p = projById(t.projectId); return p && p.name.toLowerCase().includes(n); }); }
      else if ((m = tok.match(/^@(.+)$/))) { const n = m[1]; preds.push((t) => t.tags.some((x) => x.toLowerCase().includes(n))); }
      else free.push(tok);
    });
    const ft = free.join(" ");
    if (ft) preds.push((t) => { const p = projById(t.projectId); return t.title.toLowerCase().includes(ft) ||
      (t.notes || "").toLowerCase().includes(ft) || t.tags.some((x) => x.toLowerCase().includes(ft)) || (p && p.name.toLowerCase().includes(ft)); });
    return preds;
  }
  function matchesSearch(t) { if (!searchQ) return true; return searchPreds.every((fn) => fn(t)); }

  function viewTasks() {
    let list = state.tasks.filter(matchesSearch);
    if (state.settings.project) list = list.filter((t) => t.projectId === state.settings.project);
    const t = todayKey();
    if (currentView === "today") return list.filter((x) => !x.done && x.due && x.due <= t);
    if (currentView === "upcoming") { const max = key(addDays(new Date(), 7)); return list.filter((x) => !x.done && x.due && x.due > t && x.due <= max); }
    if (currentView === "all") return list.filter((x) => !x.done);
    if (currentView === "completed") return list.filter((x) => x.done).sort((a, b) => b.completedAt - a.completedAt);
    return list;
  }

  function updateCounts() {
    const t = todayKey(), max = key(addDays(new Date(), 7));
    const a = activeTasks();
    $("#b-today").textContent = a.filter((x) => x.due && x.due <= t).length;
    $("#b-up").textContent = a.filter((x) => x.due && x.due > t && x.due <= max).length;
    $("#b-all").textContent = a.length;
    $("#b-done").textContent = state.tasks.filter((x) => x.done).length;
  }

  function taskChips(t) {
    let html = "";
    const pj = projById(t.projectId);
    if (pj) html += '<span class="chip proj"><span style="width:7px;height:7px;border-radius:50%;background:' + pj.color + ';display:inline-block"></span>' + esc(pj.name) + "</span>";
    if (t.due) { const cls = t.due < todayKey() ? " over" : (t.due === todayKey() ? " today" : ""); html += '<span class="chip due' + cls + '">🗓 ' + fmtDue(t.due) + "</span>"; }
    const sc = t.subtasks.length; if (sc) { const dn = t.subtasks.filter((s) => s.done).length; html += '<span class="chip sub">☑ ' + dn + "/" + sc + "</span>"; }
    if (t.focusSeconds > 60) html += '<span class="chip foc">⏱ ' + Math.round(t.focusSeconds / 60) + "m</span>";
    if (t.repeat && t.repeat !== "none") html += '<span class="chip sub">🔁 ' + t.repeat + "</span>";
    t.tags.forEach((tg) => html += '<span class="chip tag">#' + esc(tg) + "</span>");
    return html;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function renderTaskItem(t) {
    const el = document.createElement("div");
    const isSel = selected.has(t.id);
    const reorderable = !selectMode && listOpts.sort === "manual" && (currentView === "all" || currentView === "completed");
    el.className = "task" + (t.done ? " pdone" : "") + (openTaskId === t.id && !selectMode ? " open" : "") + (isSel ? " selected" : "");
    const hasMeta = t.subtasks.length || t.due || t.projectId || t.tags.length || t.focusSeconds > 60 || (t.repeat && t.repeat !== "none");
    const leftCtl = selectMode ? '<div class="t-sel" data-act="sel">' + (isSel ? "✓" : "") + "</div>"
                               : '<div class="t-check" data-act="done"></div>';
    const handle = reorderable ? '<div class="t-handle" title="Drag to reorder">⠿</div>' : "";
    el.innerHTML =
      '<div class="t-row">' + handle + leftCtl +
        '<div class="t-flag" style="background:' + P_COLORS[t.priority] + '"></div>' +
        '<div class="t-body" data-act="open"><div class="t-title">' + esc(t.title) + "</div>" +
          (hasMeta ? '<div class="t-meta">' + taskChips(t) + "</div>" : "") +
          (t.subtasks.length ? '<div class="t-prog"><i style="width:' + Math.round(t.subtasks.filter((s) => s.done).length / t.subtasks.length * 100) + '%"></i></div>' : "") +
        "</div>" +
        '<div class="t-actions">' +
          '<button data-act="focus" class="' + (state.activeTaskId === t.id ? "focusing" : "") + '" title="Set as focus task">⏱</button>' +
          '<button data-act="dup" title="Duplicate">⧉</button>' +
          '<button data-act="open" title="Edit">✏️</button>' +
          '<button data-act="del" title="Delete">🗑</button>' +
        "</div>" +
      "</div>" + (selectMode ? "" : editorHtml(t));

    if (selectMode) {
      const toggleSel = () => { if (selected.has(t.id)) selected.delete(t.id); else selected.add(t.id); render(); };
      $("[data-act=sel]", el).onclick = toggleSel;
      $(".t-body", el).onclick = toggleSel;
    } else {
      $("[data-act=done]", el).onclick = () => toggleDone(t.id);
      $$(".t-body,[data-act=open]", el).forEach((b) => b.onclick = () => { openTaskId = openTaskId === t.id ? null : t.id; render(); });
      $("[data-act=focus]", el).onclick = (e) => { e.stopPropagation(); state.activeTaskId = t.id; save(); updateFocusWidget(); render(); toast("Focus task set"); };
      $("[data-act=dup]", el).onclick = (e) => { e.stopPropagation(); duplicateTask(t.id); };
      $("[data-act=del]", el).onclick = (e) => { e.stopPropagation(); delTask(t.id); };
      if (openTaskId === t.id) wireEditor(el, t);
    }

    if (reorderable) {
      el.draggable = true;
      el.addEventListener("dragstart", (e) => { dragReorderId = t.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", t.id); } catch (_) {} });
      el.addEventListener("dragend", () => { dragReorderId = null; el.classList.remove("dragging"); $$(".task").forEach((x) => x.classList.remove("drop-before", "drop-after")); });
      el.addEventListener("dragover", (e) => { if (!dragReorderId || dragReorderId === t.id) return; e.preventDefault();
        const r = el.getBoundingClientRect(); const before = e.clientY - r.top < r.height / 2;
        el.classList.toggle("drop-before", before); el.classList.toggle("drop-after", !before); });
      el.addEventListener("dragleave", () => el.classList.remove("drop-before", "drop-after"));
      el.addEventListener("drop", (e) => { e.preventDefault(); const r = el.getBoundingClientRect(); const before = e.clientY - r.top < r.height / 2;
        el.classList.remove("drop-before", "drop-after"); if (dragReorderId) reorderManual(dragReorderId, t.id, before); });
    }
    return el;
  }

  function editorHtml(t) {
    if (openTaskId !== t.id) return "";
    const projOpts = ['<option value="">No project</option>'].concat(
      state.projects.map((p) => '<option value="' + p.id + '"' + (p.id === t.projectId ? " selected" : "") + ">" + esc(p.name) + "</option>")).join("");
    const prioOpts = [1,2,3,4].map((p) => '<option value="' + p + '"' + (p === t.priority ? " selected" : "") + ">P" + p + "</option>").join("");
    let subs = t.subtasks.map((s) =>
      '<div class="sub-item ' + (s.done ? "done" : "") + '" data-sid="' + s.id + '">' +
      '<div class="sc" data-sact="toggle"></div><span>' + esc(s.title) + "</span>" +
      '<span class="srm" data-sact="rm">✕</span></div>').join("");
    const repeatOpts = [["none","No repeat"],["daily","Daily"],["weekday","Every weekday"],["weekly","Weekly"],["monthly","Monthly"]]
      .map(([v, l]) => '<option value="' + v + '"' + ((t.repeat || "none") === v ? " selected" : "") + ">" + l + "</option>").join("");
    return '<div class="t-edit">' +
      '<input class="t-title-edit" data-ed="title" value="' + esc(t.title) + '" placeholder="Task title">' +
      '<div class="edit-grid">' +
        '<div class="field"><label>Due date</label><input type="date" data-ed="due" value="' + (t.due || "") + '"></div>' +
        '<div class="field"><label>Priority</label><select data-ed="priority">' + prioOpts + "</select></div>" +
        '<div class="field"><label>Project</label><select data-ed="project">' + projOpts + "</select></div>" +
        '<div class="field"><label>Repeat</label><select data-ed="repeat">' + repeatOpts + "</select></div>" +
      "</div>" +
      '<textarea class="notes" data-ed="notes" placeholder="Notes…">' + esc(t.notes || "") + "</textarea>" +
      '<div class="subs">' + subs + "</div>" +
      '<div class="sub-add"><input data-ed="subnew" placeholder="Add a subtask…"><button data-ed="subadd">Add step</button></div>' +
      '<div style="margin-top:12px;display:flex;gap:8px"><button class="sub-add" data-ed="savetpl" style="border:1px solid var(--ring);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:600">⭐ Save as template</button>' +
      '<button data-ed="dup2" style="border:1px solid var(--ring);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:600">⧉ Duplicate</button></div>' +
    "</div>";
  }

  function wireEditor(el, t) {
    const titleEl = $("[data-ed=title]", el);
    const commitTitle = (e) => { const v = e.target.value.trim(); if (v && v !== t.title) { updTask(t.id, { title: v }); softRefresh(); } };
    titleEl.onblur = commitTitle;
    titleEl.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); commitTitle(e); render(); } };
    $("[data-ed=repeat]", el).onchange = (e) => { updTask(t.id, { repeat: e.target.value }); render(); };
    $("[data-ed=due]", el).onchange = (e) => { updTask(t.id, { due: e.target.value || null }); softRefresh(); };
    $("[data-ed=priority]", el).onchange = (e) => { updTask(t.id, { priority: +e.target.value }); softRefresh(); };
    $("[data-ed=project]", el).onchange = (e) => { updTask(t.id, { projectId: e.target.value || null }); softRefresh(); };
    $("[data-ed=notes]", el).onblur = (e) => updTask(t.id, { notes: e.target.value });
    const addSub = () => { const inp = $("[data-ed=subnew]", el); const v = inp.value.trim(); if (!v) return; t.subtasks.push(sub(v, false)); save(); render(); };
    $("[data-ed=savetpl]", el).onclick = () => saveTemplate(t.id);
    $("[data-ed=dup2]", el).onclick = () => duplicateTask(t.id);
    $("[data-ed=subadd]", el).onclick = addSub;
    $("[data-ed=subnew]", el).onkeydown = (e) => { if (e.key === "Enter") addSub(); };
    $$(".sub-item", el).forEach((si) => {
      const sid = si.dataset.sid; const s = t.subtasks.find((x) => x.id === sid);
      $("[data-sact=toggle]", si).onclick = () => { s.done = !s.done; save(); render(); };
      $("[data-sact=rm]", si).onclick = () => { t.subtasks = t.subtasks.filter((x) => x.id !== sid); save(); render(); };
    });
  }
  function softRefresh() { updateCounts(); renderProjects(); }

  // ---------- board ----------
  const COLS = [ { id: "todo", name: "To Do", color: "var(--p3)" }, { id: "doing", name: "In Progress", color: "var(--p2)" }, { id: "done", name: "Done", color: "var(--ok)" } ];
  function renderBoard(root) {
    const wrap = document.createElement("div"); wrap.className = "board";
    let list = state.tasks.filter(matchesSearch);
    if (state.settings.project) list = list.filter((t) => t.projectId === state.settings.project);
    COLS.forEach((col) => {
      const items = list.filter((t) => (t.status || (t.done ? "done" : "todo")) === col.id);
      const cEl = document.createElement("div"); cEl.className = "col"; cEl.dataset.col = col.id;
      cEl.innerHTML = '<div class="col-head"><span class="dotc" style="background:' + col.color + '"></span>' + col.name + '<span class="cnt">' + items.length + "</span></div>";
      items.forEach((t) => {
        const c = document.createElement("div"); c.className = "bcard"; c.draggable = true; c.dataset.id = t.id;
        c.style.borderLeftColor = P_COLORS[t.priority];
        c.innerHTML = '<div class="bt">' + esc(t.title) + '</div>' + (taskChips(t) ? '<div class="bm">' + taskChips(t) + "</div>" : "");
        c.addEventListener("dragstart", (e) => { c.classList.add("dragging"); e.dataTransfer.setData("text/plain", t.id); });
        c.addEventListener("dragend", () => c.classList.remove("dragging"));
        cEl.appendChild(c);
      });
      cEl.addEventListener("dragover", (e) => { e.preventDefault(); cEl.classList.add("drag-over"); });
      cEl.addEventListener("dragleave", () => cEl.classList.remove("drag-over"));
      cEl.addEventListener("drop", (e) => {
        e.preventDefault(); cEl.classList.remove("drag-over");
        const id = e.dataTransfer.getData("text/plain"); const t = state.tasks.find((x) => x.id === id); if (!t) return;
        t.status = col.id; t.done = col.id === "done"; t.completedAt = t.done ? (t.completedAt || Date.now()) : null;
        save(); render();
      });
      wrap.appendChild(cEl);
    });
    root.appendChild(wrap);
  }

  // ---------- week planner ----------
  function weekStartOf(d) { const x = new Date(d); const dow = (x.getDay() + 6) % 7; return addDays(x, -dow); } // Monday start
  function addTaskWithDue(title, dueKey) { const v = (title || "").trim(); if (!v) return; const p = parseQuick(v); if (!p.due) p.due = dueKey; state.tasks.unshift(mkTask(p.title, p)); save(); }
  function wcardEl(t) {
    const c = document.createElement("div"); c.className = "wcard" + (t.done ? " pdone" : "");
    c.draggable = true; c.dataset.id = t.id; c.style.borderLeftColor = P_COLORS[t.priority];
    const pj = projById(t.projectId);
    c.innerHTML = '<div class="wc-check">' + (t.done ? "✓" : "") + '</div><div style="flex:1;min-width:0"><div class="wc-t">' + esc(t.title) + "</div>" +
      (pj ? '<div class="wc-pj chip proj"><span style="width:6px;height:6px;border-radius:50%;background:' + pj.color + ';display:inline-block"></span>' + esc(pj.name) + "</div>" : "") +
      (t.repeat && t.repeat !== "none" ? ' <span class="wc-pj" style="color:var(--faint)">🔁</span>' : "") + "</div>";
    $(".wc-check", c).onclick = (e) => { e.stopPropagation(); toggleDone(t.id); };
    c.addEventListener("dragstart", (e) => { c.classList.add("dragging"); e.dataTransfer.setData("text/plain", t.id); });
    c.addEventListener("dragend", () => c.classList.remove("dragging"));
    c.addEventListener("dblclick", () => { openTaskFromCmd(t.id); });
    return c;
  }
  function makeDropZone(el, onDropKey) {
    el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("drag-over"); });
    el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
    el.addEventListener("drop", (e) => { e.preventDefault(); el.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/plain"); const t = state.tasks.find((x) => x.id === id); if (!t) return;
      t.due = onDropKey; if (t.done && onDropKey) { /* keep */ } save(); render(); });
  }
  function renderWeek(root) {
    const start = weekStartOf(weekAnchor);
    const end = addDays(start, 6);
    const list = state.tasks.filter(matchesSearch).filter((t) => !state.settings.project || t.projectId === state.settings.project);

    // nav
    const nav = document.createElement("div"); nav.className = "week-nav";
    const fmtR = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const sameWeek = key(weekStartOf(new Date())) === key(start);
    nav.innerHTML = '<button class="wbtn" id="wPrev">← Prev</button>' +
      '<button class="wbtn' + (sameWeek ? " wtoday" : "") + '" id="wToday">This week</button>' +
      '<button class="wbtn" id="wNext">Next →</button>' +
      '<span class="range">' + fmtR(start) + " – " + fmtR(end) + ", " + end.getFullYear() + "</span>";
    root.appendChild(nav);
    $("#wPrev", nav).onclick = () => { weekAnchor = addDays(start, -7); render(); };
    $("#wNext", nav).onclick = () => { weekAnchor = addDays(start, 7); render(); };
    $("#wToday", nav).onclick = () => { weekAnchor = new Date(); render(); };

    // grid
    const grid = document.createElement("div"); grid.className = "week-grid";
    const tKey = todayKey();
    for (let i = 0; i < 7; i++) {
      const day = addDays(start, i), dk = key(day);
      const col = document.createElement("div");
      col.className = "wday" + (dk === tKey ? " today" : "") + (dk < tKey ? " past" : "");
      const head = document.createElement("div"); head.className = "wday-head";
      head.innerHTML = '<span class="dow">' + day.toLocaleDateString(undefined, { weekday: "short" }) + '</span>' +
        '<span class="dnum">' + day.getDate() + '</span><span class="wadd" title="Add task">＋</span>';
      col.appendChild(head);
      if (weekAddDay === dk) {
        const inp = document.createElement("input"); inp.className = "wadd-input"; inp.placeholder = "New task…  (Enter)";
        inp.onkeydown = (e) => { if (e.key === "Enter") { addTaskWithDue(e.target.value, dk); weekAddDay = dk; render(); }
          else if (e.key === "Escape") { weekAddDay = null; render(); } };
        col.appendChild(inp); setTimeout(() => inp.focus(), 10);
      }
      $(".wadd", head).onclick = () => { weekAddDay = weekAddDay === dk ? null : dk; render(); };
      const dayTasks = list.filter((t) => t.due === dk).sort((a, b) => (a.done - b.done) || a.priority - b.priority);
      if (!dayTasks.length && weekAddDay !== dk) { const e = document.createElement("div"); e.className = "wempty"; e.textContent = "—"; col.appendChild(e); }
      dayTasks.forEach((t) => col.appendChild(wcardEl(t)));
      makeDropZone(col, dk);
      grid.appendChild(col);
    }
    root.appendChild(grid);

    // backlog (undated, open)
    const backlog = document.createElement("div"); backlog.className = "backlog";
    const undated = list.filter((t) => !t.due && !t.done);
    backlog.innerHTML = '<h4>Backlog · no date (' + undated.length + ') — drag onto a day to schedule</h4>';
    const items = document.createElement("div"); items.className = "backlog-items";
    if (!undated.length) items.innerHTML = '<span class="backlog-empty">Nothing unscheduled. Nice.</span>';
    undated.forEach((t) => items.appendChild(wcardEl(t)));
    backlog.appendChild(items);
    makeDropZone(backlog, null);
    root.appendChild(backlog);
  }

  // ---------- analytics ----------
  function renderAnalytics(root) {
    const days = []; for (let i = 6; i >= 0; i--) days.push(addDays(new Date(), -i));
    const doneByDay = days.map((d) => { const k = key(d); return state.tasks.filter((t) => t.done && t.completedAt && key(new Date(t.completedAt)) === k).length; });
    const maxDone = Math.max(1, ...doneByDay);
    const focusToday = focusMinutesOn(todayKey());
    const focusTotal = Math.round(state.focusLog.reduce((s, f) => s + f.seconds, 0) / 60);
    const open = activeTasks().length, done = state.tasks.filter((t) => t.done).length;
    const rate = state.tasks.length ? Math.round((done / state.tasks.length) * 100) : 0;
    const streak = computeStreak();

    const stats = document.createElement("div"); stats.className = "stats-row";
    stats.innerHTML =
      statCard("Current Streak", streak + '<small> day' + (streak === 1 ? "" : "s") + "</small>") +
      statCard("Focus Today", focusToday + '<small> min</small>') +
      statCard("Completed", done + '<small> / ' + state.tasks.length + " total</small>") +
      statCard("Completion Rate", rate + '<small>%</small>');
    root.appendChild(stats);

    const chart = document.createElement("div"); chart.className = "panel-card";
    chart.innerHTML = "<h3>Tasks completed · last 7 days</h3>";
    const c = document.createElement("div"); c.className = "chart";
    days.forEach((d, i) => {
      const col = document.createElement("div"); col.className = "bar-col";
      const h = Math.round((doneByDay[i] / maxDone) * 150);
      col.innerHTML = '<div class="bar" style="height:' + (doneByDay[i] ? h : 3) + 'px"><span class="num">' + (doneByDay[i] || "") + '</span></div>' +
        '<div class="bar-lbl">' + d.toLocaleDateString(undefined, { weekday: "short" }) + "</div>";
      c.appendChild(col);
    });
    chart.appendChild(c); root.appendChild(chart);

    // per-project breakdown
    const rows = state.projects.map((p) => projStats(p.id, p.name, p.color))
      .concat([projStats(null, "No project", "var(--faint)")])
      .filter((r) => r.total > 0)
      .sort((a, b) => b.total - a.total);
    if (rows.length) {
      const pj = document.createElement("div"); pj.className = "panel-card";
      pj.innerHTML = "<h3>By project</h3>";
      const maxTotal = Math.max(1, ...rows.map((r) => r.total));
      rows.forEach((r) => {
        const pct = Math.round((r.done / r.total) * 100);
        const row = document.createElement("div"); row.style.cssText = "margin-bottom:14px";
        row.innerHTML =
          '<div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px">' +
            '<span style="width:9px;height:9px;border-radius:50%;background:' + r.color + '"></span>' +
            '<b>' + esc(r.name) + "</b>" +
            '<span style="margin-left:auto;color:var(--muted)">' + r.done + "/" + r.total + " done · " + r.focus + "m focus</span></div>" +
          '<div style="height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden">' +
            '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,var(--accent),var(--accent-2))"></div></div>';
        pj.appendChild(row);
      });
      root.appendChild(pj);
    }

    const foc = document.createElement("div"); foc.className = "panel-card";
    foc.innerHTML = "<h3>Focus time</h3><div style='color:var(--muted);font-size:14px'>You've logged <b style='color:var(--text)'>" +
      focusTotal + " minutes</b> of focused work across " + state.focusLog.length + " sessions. " +
      "Pick a task, hit ▶ Start on the timer, and every completed session is banked here.</div>";
    root.appendChild(foc);
  }
  function statCard(k, v) { return '<div class="stat-card"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>"; }
  function projStats(pid, name, color) {
    const ts = state.tasks.filter((t) => (t.projectId || null) === pid);
    return { name, color, total: ts.length, done: ts.filter((t) => t.done).length,
      focus: Math.round(ts.reduce((s, t) => s + (t.focusSeconds || 0), 0) / 60) };
  }
  function focusMinutesOn(k) { return Math.round(state.focusLog.filter((f) => f.date === k).reduce((s, f) => s + f.seconds, 0) / 60); }
  function computeStreak() {
    const set = new Set(state.tasks.filter((t) => t.done && t.completedAt).map((t) => key(new Date(t.completedAt))));
    let streak = 0; let d = new Date();
    if (!set.has(key(d))) d = addDays(d, -1);
    while (set.has(key(d))) { streak++; d = addDays(d, -1); }
    return streak;
  }

  // ---------- main render ----------
  const TITLES = { today: ["Today", "Everything due today or overdue"], upcoming: ["Upcoming", "Due in the next 7 days"],
    week: ["Week", "Plan your week — drag tasks between days"],
    all: ["All Tasks", "Every open task"], board: ["Board", "Drag cards between columns"],
    analytics: ["Analytics", "Your productivity at a glance"], completed: ["Completed", "Finished and archived"] };

  function render() {
    updateCounts(); renderProjects(); renderSavedViews(); renderNav();
    const [title, subFixed] = TITLES[currentView];
    let sub = subFixed;
    if (state.settings.project) { const p = projById(state.settings.project); if (p) sub += " · in " + p.name; }
    $("#viewTitle").textContent = title; $("#viewSub").textContent = sub;
    $("#quickadd").style.display = (currentView === "analytics") ? "none" : "block";

    const root = $("#content"); root.innerHTML = "";
    if (currentView === "board" || currentView === "week" || currentView === "analytics") { selectMode = false; selected.clear(); }
    updateBulkBar();
    if (currentView === "board") return void renderBoard(root);
    if (currentView === "week") return void renderWeek(root);
    if (currentView === "analytics") return void renderAnalytics(root);

    const tasks = applyListOpts(viewTasks());
    renderListControls(root);
    renderTemplateBar(root);
    if (!tasks.length) {
      const emptyEl = document.createElement("div"); emptyEl.className = "empty";
      emptyEl.innerHTML = '<div class="big">' + (currentView === "completed" ? "🗃️" : "🌱") + '</div><div class="msg">' +
        (searchQ ? "No tasks match your search." :
         (listOpts.priority !== "all" || listOpts.tag !== "all") ? "No tasks match these filters." :
         currentView === "today" ? "Nothing due today. Add a task or enjoy the clear runway." :
         currentView === "completed" ? "No completed tasks yet — go finish something!" : "No tasks here yet. Add one above.") + "</div>";
      root.appendChild(emptyEl); return;
    }
    if (currentView === "upcoming") {
      const groups = {}; tasks.forEach((t) => { (groups[t.due] = groups[t.due] || []).push(t); });
      Object.keys(groups).sort().forEach((k) => {
        addGroup(root, fmtDue(k)); groups[k].forEach((t) => root.appendChild(renderTaskItem(t)));
      });
    } else if (currentView === "today") {
      const over = tasks.filter((t) => t.due < todayKey()); const now = tasks.filter((t) => t.due === todayKey());
      if (over.length) { addGroup(root, "Overdue"); over.forEach((t) => root.appendChild(renderTaskItem(t))); }
      if (now.length) { addGroup(root, "Today"); now.forEach((t) => root.appendChild(renderTaskItem(t))); }
    } else {
      sortFlat(tasks).forEach((t) => root.appendChild(renderTaskItem(t)));
    }
  }
  function addGroup(root, label) { const g = document.createElement("div"); g.className = "group-label"; g.innerHTML = esc(label) + '<span class="line"></span>'; root.appendChild(g); }

  function renderTemplateBar(root) {
    if (selectMode || !state.templates.length) return;
    const bar = document.createElement("div"); bar.className = "tpl-bar";
    bar.innerHTML = '<span class="tpl-lbl">Templates</span>';
    state.templates.forEach((tp) => {
      const chip = document.createElement("div"); chip.className = "tpl-chip";
      chip.innerHTML = "＋ " + esc(tp.name) + ' <span class="tpl-x" title="Delete template">✕</span>';
      chip.onclick = (e) => { if (e.target.classList.contains("tpl-x")) return; createFromTemplate(tp.id); };
      $(".tpl-x", chip).onclick = (e) => { e.stopPropagation(); delTemplate(tp.id); };
      bar.appendChild(chip);
    });
    root.appendChild(bar);
  }

  function updateBulkBar() {
    const old = $("#bulkBar"); if (old) old.remove();
    if (!selectMode || !selected.size) return;
    const bar = document.createElement("div"); bar.className = "bulk-bar"; bar.id = "bulkBar";
    const prioSel = '<select id="bulk-prio"><option value="">Priority…</option>' + [1,2,3,4].map((p) => '<option value="' + p + '">Set P' + p + "</option>").join("") + "</select>";
    bar.innerHTML =
      '<span class="bcount">' + selected.size + " selected</span><span class=\"bsep\"></span>" +
      '<button id="bulk-done">✓ Complete</button>' +
      '<button id="bulk-today">🗓 Today</button>' +
      '<button id="bulk-tom">Tomorrow</button>' +
      '<button id="bulk-cleardue">Clear date</button>' + prioSel +
      '<span class="bsep"></span><button id="bulk-del" class="danger">🗑 Delete</button>' +
      '<button id="bulk-cancel">Cancel</button>';
    document.body.appendChild(bar);
    $("#bulk-done", bar).onclick = () => bulkApply((t) => { t.done = true; t.status = "done"; t.completedAt = t.completedAt || Date.now(); }, "Completed");
    $("#bulk-today", bar).onclick = () => bulkApply((t) => { t.due = todayKey(); }, "Rescheduled to today");
    $("#bulk-tom", bar).onclick = () => bulkApply((t) => { t.due = tomorrowKey(); }, "Rescheduled to tomorrow");
    $("#bulk-cleardue", bar).onclick = () => bulkApply((t) => { t.due = null; }, "Dates cleared");
    $("#bulk-prio", bar).onchange = (e) => { if (e.target.value) bulkApply((t) => { t.priority = +e.target.value; }, "Priority set"); };
    $("#bulk-del", bar).onclick = () => bulkDelete();
    $("#bulk-cancel", bar).onclick = () => { selectMode = false; selected.clear(); render(); };
  }

  function renderNav() { $$("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === currentView && !state.settings.project && !activeViewId)); }
  function renderProjects() {
    const box = $("#projects"); box.innerHTML = "";
    const allBtn = document.createElement("div"); allBtn.className = "proj" + (!state.settings.project ? " active" : "");
    allBtn.innerHTML = '<span class="swatch" style="background:var(--muted)"></span>All projects';
    allBtn.onclick = () => { state.settings.project = null; activeViewId = null; save(); render(); };
    box.appendChild(allBtn);
    state.projects.forEach((p) => {
      const open = activeTasks().filter((t) => t.projectId === p.id).length;
      const el = document.createElement("div"); el.className = "proj" + (state.settings.project === p.id ? " active" : "");
      el.innerHTML = '<span class="swatch" style="background:' + p.color + '"></span>' + esc(p.name) + '<span class="cnt">' + open + '</span><span class="x" title="Delete project">✕</span>';
      el.onclick = (e) => { if (e.target.classList.contains("x")) return; state.settings.project = p.id; activeViewId = null; if (currentView === "analytics") currentView = "all"; save(); render(); };
      $(".x", el).onclick = (e) => { e.stopPropagation();
        if (!confirm('Delete project "' + p.name + '"? Its tasks are kept but unassigned.')) return;
        state.tasks.forEach((t) => { if (t.projectId === p.id) t.projectId = null; });
        state.projects = state.projects.filter((x) => x.id !== p.id);
        if (state.settings.project === p.id) state.settings.project = null; save(); render();
      };
      box.appendChild(el);
    });
  }

  function applyView(v) {
    activeViewId = v.id; searchQ = v.query; searchPreds = buildSearch(v.query);
    $("#search").value = v.query; currentView = "all"; state.settings.project = null; render();
  }
  function renderSavedViews() {
    const box = $("#savedViews"); box.innerHTML = "";
    $("#viewsSection").style.display = (state.savedViews.length || savingView) ? "flex" : "none";
    if (savingView) {
      const wrap = document.createElement("div"); wrap.className = "proj-add";
      wrap.innerHTML = '<input id="viewNameInput" placeholder="Name this view, Enter to save" maxlength="40">';
      box.appendChild(wrap);
      const inp = $("#viewNameInput", wrap); inp.value = searchQ;
      inp.onkeydown = (e) => {
        if (e.key === "Enter") { const n = e.target.value.trim(); if (n) { state.savedViews.push({ id: uid(), name: n, query: searchQ }); save(); } savingView = false; render(); }
        else if (e.key === "Escape") { savingView = false; render(); }
      };
      setTimeout(() => inp.focus(), 10);
    }
    state.savedViews.forEach((v) => {
      const el = document.createElement("div"); el.className = "proj" + (activeViewId === v.id ? " active" : "");
      el.innerHTML = '<span class="swatch" style="background:var(--accent-2)">🔎</span>' + esc(v.name) + '<span class="x" title="Delete view">✕</span>';
      $(".swatch", el).textContent = ""; // keep dot style
      el.title = "Search: " + v.query;
      el.onclick = (e) => { if (e.target.classList.contains("x")) return; applyView(v); };
      $(".x", el).onclick = (e) => { e.stopPropagation(); state.savedViews = state.savedViews.filter((x) => x.id !== v.id); if (activeViewId === v.id) activeViewId = null; save(); render(); };
      box.appendChild(el);
    });
  }

  // ---------- focus timer ----------
  let fMode = 25, fRemaining = 25 * 60, fRunning = false, fTicker = null, fTotal = 25 * 60;
  function fmtT(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
  function updateFocusWidget() {
    const t = state.tasks.find((x) => x.id === state.activeTaskId && !x.done);
    if (!t && state.activeTaskId) state.activeTaskId = null;
    $("#fwTask").innerHTML = "Focus: <b>" + (t ? esc(t.title.slice(0, 40)) : "no task selected") + "</b>";
    $("#fwTime").textContent = fmtT(fRemaining);
  }
  function fTick() {
    fRemaining--;
    if (fRemaining <= 0) {
      fStop();
      if (fMode >= 15) { // count real focus sessions (25 or 15), not short breaks
        const secs = fTotal; const k = todayKey();
        state.focusLog.push({ date: k, seconds: secs, taskId: state.activeTaskId || null });
        const t = state.tasks.find((x) => x.id === state.activeTaskId); if (t) t.focusSeconds = (t.focusSeconds || 0) + secs;
        save(); toast("Focus session banked ⏱ +" + Math.round(secs / 60) + "m"); beep();
        if (currentView === "analytics") render();
      } else { toast("Break over — back to it!"); beep(); }
      fRemaining = fTotal;
    }
    $("#fwTime").textContent = fmtT(fRemaining);
  }
  function fStart() { fRunning = true; $("#fwPlay").textContent = "Pause"; fTicker = setInterval(fTick, 1000); }
  function fStop() { fRunning = false; $("#fwPlay").textContent = "Start"; clearInterval(fTicker); }
  function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); [880, 1180].forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; o.connect(g); g.connect(c.destination); const t = c.currentTime + i * 0.16; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14); o.start(t); o.stop(t + 0.16); }); } catch (e) {} }

  $("#fwPlay").onclick = () => (fRunning ? fStop() : fStart());
  $("#fwReset").onclick = () => { fStop(); fRemaining = fTotal; updateFocusWidget(); };
  $$("#fwModes button").forEach((b) => b.onclick = () => {
    $$("#fwModes button").forEach((x) => x.classList.remove("on")); b.classList.add("on");
    fMode = +b.dataset.min; fTotal = fMode * 60; fRemaining = fTotal; fStop(); updateFocusWidget();
  });

  // ---------- toast ----------
  let toastT; function toast(m, actionLabel, actionFn) {
    const t = $("#toast"); t.innerHTML = "";
    t.appendChild(document.createTextNode(m));
    if (actionLabel) { const b = document.createElement("button"); b.className = "toast-act"; b.textContent = actionLabel;
      b.onclick = () => { t.classList.remove("show"); actionFn(); }; t.appendChild(b); }
    t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), actionLabel ? 5000 : 1600);
  }

  // ---------- top-level wiring ----------
  $$("#nav button").forEach((b) => b.onclick = () => { currentView = b.dataset.view; state.settings.project = null; state.settings.view = currentView; activeViewId = null; save(); openTaskId = null; render(); $("#sidebar").classList.remove("show"); });
  $("#qaBtn").onclick = () => { const i = $("#qaInput"); addTask(i.value); i.value = ""; i.focus(); };
  $("#qaInput").onkeydown = (e) => { if (e.key === "Enter") { addTask(e.target.value); e.target.value = ""; } };
  $("#search").oninput = (e) => { searchQ = e.target.value.trim(); searchPreds = buildSearch(searchQ); activeViewId = null; render(); };
  $("#saveViewBtn").onclick = () => { if (!searchQ) { toast("Type a search first, then save it as a view."); $("#search").focus(); return; } savingView = true; render(); };
  $("#projAddBtn").onclick = () => { const w = $("#projAddWrap"); w.style.display = w.style.display === "none" ? "block" : "none"; if (w.style.display === "block") $("#projInput").focus(); };
  $("#projInput").onkeydown = (e) => { if (e.key === "Enter") { const v = e.target.value.trim(); if (v) { state.projects.push({ id: uid(), name: v, color: PROJ_COLORS[state.projects.length % PROJ_COLORS.length] }); save(); e.target.value = ""; render(); } } };
  $("#menuBtn").onclick = () => $("#sidebar").classList.toggle("show");

  // theme
  function applyTheme(t) { document.body.setAttribute("data-theme", t); $("#themeBtn").textContent = t === "light" ? "🌞" : "🌙"; state.settings.theme = t; save(); }
  $("#themeBtn").onclick = () => applyTheme(document.body.getAttribute("data-theme") === "light" ? "dark" : "light");

  // export / import
  $("#exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "momentum-" + todayKey() + ".json"; a.click(); toast("Exported backup");
  };
  $("#importBtn").onclick = () => $("#fileInput").click();
  $("#fileInput").onchange = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d.tasks) throw 0; state = Object.assign({}, DEFAULT, d); save(); currentView = state.settings.view || "today"; applyTheme(state.settings.theme || "dark"); render(); updateFocusWidget(); toast("Data imported"); } catch (err) { toast("Invalid file"); } };
    r.readAsText(f); e.target.value = ""; };

  // ---------- command palette ----------
  let cmdItems = [], cmdSel = 0;
  function gotoView(v) { currentView = v; state.settings.view = v; state.settings.project = null; save(); openTaskId = null; render(); }
  function buildCommands() {
    const cmds = [
      { grp: "Navigate", ic: "☀️", label: "Go to Today", run: () => gotoView("today") },
      { grp: "Navigate", ic: "🗓️", label: "Go to Upcoming", run: () => gotoView("upcoming") },
      { grp: "Navigate", ic: "🗂️", label: "Go to All Tasks", run: () => gotoView("all") },
      { grp: "Navigate", ic: "📋", label: "Go to Board", run: () => gotoView("board") },
      { grp: "Navigate", ic: "📊", label: "Go to Analytics", run: () => gotoView("analytics") },
      { grp: "Navigate", ic: "✅", label: "Go to Completed", run: () => gotoView("completed") },
      { grp: "Action", ic: "➕", label: "New task", run: () => { setTimeout(() => $("#qaInput").focus(), 20); } },
      { grp: "Action", ic: "⏱", label: (fRunning ? "Pause" : "Start") + " focus timer", run: () => (fRunning ? fStop() : fStart()) },
      { grp: "Action", ic: "🌓", label: "Toggle light / dark theme", run: () => $("#themeBtn").click() },
      { grp: "Action", ic: "⬇︎", label: "Export data (JSON backup)", run: () => $("#exportBtn").click() },
      { grp: "Action", ic: "⬆︎", label: "Import data", run: () => $("#importBtn").click() },
    ];
    return cmds;
  }
  function openTaskFromCmd(id) { gotoView("all"); openTaskId = id; render(); const el = $(".task.open"); if (el) el.scrollIntoView({ block: "center" }); }
  function renderCmd(q) {
    const list = $("#cmdkList"); list.innerHTML = ""; cmdItems = [];
    const ql = q.toLowerCase().trim();
    const cmds = buildCommands().filter((c) => !ql || c.label.toLowerCase().includes(ql));
    const taskMatches = (ql ? state.tasks.filter((t) => !t.done && t.title.toLowerCase().includes(ql)) : []).slice(0, 6);
    let html = "", i = 0; let lastGrp = "";
    cmds.forEach((c) => { if (c.grp !== lastGrp) { html += '<div class="cmdk-group">' + c.grp + "</div>"; lastGrp = c.grp; }
      html += cmdRow(i++, c.ic, c.label, ""); cmdItems.push({ run: c.run }); });
    if (taskMatches.length) { html += '<div class="cmdk-group">Tasks</div>';
      taskMatches.forEach((t) => { html += cmdRow(i++, "•", esc(t.title), "open"); cmdItems.push({ run: () => openTaskFromCmd(t.id) }); }); }
    list.innerHTML = html || '<div class="cmdk-item" style="color:var(--faint)">No matches</div>';
    cmdSel = 0; paintCmdSel();
    $$(".cmdk-item", list).forEach((el, idx) => { el.onclick = () => { closeCmd(); cmdItems[idx] && cmdItems[idx].run(); }; el.onmousemove = () => { cmdSel = idx; paintCmdSel(); }; });
  }
  function cmdRow(i, ic, label, sub) { return '<div class="cmdk-item" data-i="' + i + '"><span class="ci-ic">' + ic + '</span><span>' + label + '</span>' + (sub ? '<span class="ci-sub">' + sub + "</span>" : "") + "</div>"; }
  function paintCmdSel() { $$(".cmdk-item").forEach((el, idx) => el.classList.toggle("sel", idx === cmdSel)); }
  function openCmd() { $("#cmdkBack").classList.add("show"); const i = $("#cmdkInput"); i.value = ""; renderCmd(""); setTimeout(() => i.focus(), 20); }
  function closeCmd() { $("#cmdkBack").classList.remove("show"); }
  $("#cmdkInput").oninput = (e) => renderCmd(e.target.value);
  $("#cmdkInput").onkeydown = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); cmdSel = Math.min(cmdSel + 1, cmdItems.length - 1); paintCmdSel(); scrollSel(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); paintCmdSel(); scrollSel(); }
    else if (e.key === "Enter") { e.preventDefault(); const it = cmdItems[cmdSel]; closeCmd(); it && it.run(); }
    else if (e.key === "Escape") closeCmd();
  };
  function scrollSel() { const el = $$(".cmdk-item")[cmdSel]; if (el) el.scrollIntoView({ block: "nearest" }); }
  $("#cmdkBack").onclick = (e) => { if (e.target === $("#cmdkBack")) closeCmd(); };
  $("#cmdkBtn").onclick = () => ($("#cmdkBack").classList.contains("show") ? closeCmd() : openCmd());

  // ---------- help / shortcuts ----------
  const SHORTCUTS = [
    ["Command palette", ["⌘", "K"]], ["Search", ["/"]], ["New task", ["N"]],
    ["Start / pause focus timer", ["F"]], ["This help", ["?"]], ["Close / blur field", ["Esc"]],
  ];
  function openHelp() {
    const list = $("#helpList"); list.innerHTML = "";
    SHORTCUTS.forEach(([desc, keys]) => {
      const row = document.createElement("div"); row.className = "help-row";
      row.innerHTML = "<span>" + desc + '</span><span class="hk">' + keys.map((k) => "<kbd>" + k + "</kbd>").join("") + "</span>";
      list.appendChild(row);
    });
    const note = document.createElement("div"); note.className = "help-note";
    note.innerHTML = "Search operators: <b>p1–p4</b>, <b>due:today|tomorrow|overdue|week|none</b>, <b>#project</b>, <b>@tag</b>, <b>is:done|open</b>, <b>has:sub|notes</b> — combine freely with text.";
    list.appendChild(note);
    $("#helpBack").classList.add("show");
  }
  function closeHelp() { $("#helpBack").classList.remove("show"); }
  $("#helpBack").onclick = (e) => { if (e.target === $("#helpBack")) closeHelp(); };

  // keyboard
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#cmdkBack").classList.contains("show") ? closeCmd() : openCmd(); return; }
    if (e.key === "Escape" && $("#helpBack").classList.contains("show")) { closeHelp(); return; }
    if (e.target.matches("input,textarea,select")) { if (e.key === "Escape") e.target.blur(); return; }
    if (e.key === "/") { e.preventDefault(); $("#search").focus(); }
    else if (e.key === "n") { e.preventDefault(); $("#qaInput").focus(); }
    else if (e.key === "f") { fRunning ? fStop() : fStart(); }
    else if (e.key === "?") { e.preventDefault(); $("#helpBack").classList.contains("show") ? closeHelp() : openHelp(); }
  });

  // ---------- boot ----------
  applyTheme(state.settings.theme || "dark");
  fTotal = fMode * 60; fRemaining = fTotal;
  updateFocusWidget(); render();
})();
</script>
</body>
</html>
