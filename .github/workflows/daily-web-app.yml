name: Daily Web App (Claude)

# Builds one small web app every day at 12:00 PM Manila time (UTC+8 = 04:00 UTC).
# Runs independently of any live Claude Code session.

on:
  schedule:
    # 04:00 UTC == 12:00 PM Asia/Manila (Manila has no DST, always UTC+8)
    - cron: "0 4 * * *"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write # let Claude commit and push the new app

concurrency:
  group: daily-web-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true # so `git push` uses GITHUB_TOKEN

      - name: Configure git identity
        run: |
          git config user.name "claude-daily[bot]"
          git config user.email "claude-daily@users.noreply.github.com"

      - name: Build today's web app
        uses: anthropics/claude-code-action@v1
        with:
          # Uses your Claude Pro/Max SUBSCRIPTION via an OAuth token — no
          # pay-per-use API billing. Generate it with `claude setup-token`
          # and save it as the repo secret CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"
          prompt: |
            You have ~30 minutes to make ONE meaningful improvement to Momentum,
            the productivity app at daily-apps/2026-07-26-momentum/index.html. You
            are running in a checkout of this repo on the main branch, which is
            served live via GitHub Pages. Do NOT build a new separate app — the
            goal now is to keep improving this single tool, a little every day.

            Pick the improvement yourself (do not ask anyone). Good directions:
            a genuinely useful NEW feature (e.g. task dependencies, calendar/week
            view, tag manager, bulk actions, natural-language date ranges, goal
            tracking, per-project analytics, templates, reminders, drag-to-reorder,
            themes), or a real refinement/polish of something that already exists.
            Prefer depth and usefulness over cosmetic tweaks.

            Requirements:
            1. Momentum is ONE self-contained index.html (HTML/CSS/JS, no external
               requests) that must keep working fully offline with localStorage.
            2. Preserve existing user data: if you change the data model, migrate
               old saved state gracefully rather than breaking it.
            3. VERIFY before shipping: the repo has no test runner, but you must at
               least syntax-check your JavaScript (e.g. extract the <script> and run
               `node --check`) and fix any error. Chromium is available at
               /opt/pw-browsers if you want to smoke-test in a headless browser.
            4. Update the changelog in daily-apps/index.html between the
               <!-- LOG:START --> and <!-- LOG:END --> markers: add a new dated entry
               (bump the version) describing what you changed, as the newest item.
            5. Commit with a clear message, then push: git push origin HEAD:main
            6. Do NOT open a pull request. Keep scope to roughly 30 minutes.
